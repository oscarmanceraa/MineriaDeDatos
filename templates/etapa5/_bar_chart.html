<div class="md-bars" role="img" aria-label="{{ chart_title }}; unidad: {{ panel.unit }}">
    {% for item in panel['items'] %}
    <div class="md-bar-row">
        <span class="md-bar-label" title="{{ item.label }}">{{ item.label }}</span>
        <span class="md-bar-track">
            <span class="md-bar-fill" style="width: {{ item.width }}%"></span>
        </span>
        <strong class="md-bar-value">{{ item.display }}</strong>
    </div>
    {% else %}
    <p class="md-empty">Sin resultados para los filtros seleccionados.</p>
    {% endfor %}
</div>
<p class="md-footnote">Unidad: {{ panel.unit }} · barras relativas al valor máximo de esta visualización.</p>
