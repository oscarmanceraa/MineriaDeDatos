<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Biodiversity Data Lab: explorando patrones entre la biodiversidad animal y la transformación de sus hábitats mediante Minería de Datos.">
    <title>{% block title %}Biodiversidad Mineria de Datos{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="backdrop" aria-hidden="true">
        <span class="backdrop-glow glow-green"></span>
        <span class="backdrop-glow glow-cyan"></span>
    </div>

    <header class="site-header">
        <a class="brand" href="{{ url_for('main.index') }}" aria-label="Inicio">
            <span class="brand-mark" aria-hidden="true"></span>
            <span class="brand-name">Biodiversidad&nbsp;Mineria&nbsp;De&nbsp;Datos</span>
        </a>

        <nav class="nav" aria-label="Navegación principal">
            <a class="nav-link {% block nav_inicio %}{% endblock %}" href="{{ url_for('main.index') }}">Inicio</a>
            <a class="nav-link nav-link--accent {% block nav_etapa1 %}{% endblock %}" href="{{ url_for('main.etapa1') }}">Etapa 1</a>
            <a class="nav-link {% block nav_acerca %}{% endblock %}" href="#proyecto">Acerca del proyecto</a>
            <a class="nav-link nav-link--external" href="https://github.com/oscarmanceraa/MineriaDeDatos" target="_blank" rel="noopener">
                GitHub
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M7 17 17 7"></path>
                    <path d="M7 7h10v10"></path>
                </svg>
            </a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer" id="proyecto">
        <p class="footer-line">
            Proyecto de Minería de Datos · Biodiversidad animal y pérdida de hábitat.
        </p>
        <p class="footer-sub">GLOBAL&nbsp;→&nbsp;COLOMBIA&nbsp;→&nbsp;CUNDINAMARCA</p>
    </footer>
</body>
</html>
